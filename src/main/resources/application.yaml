spring:
  application:
    name: spring-security-advanced

  datasource:
    url: jdbc:postgresql://localhost:5432/security_advanced_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 86400000
    refresh-expiration: 604800000
  security:
    max-login-attempts: 5
    lockout-duration-minutes: 15
    rate-limit-requests: 20
    rate-limit-window-seconds: 60
